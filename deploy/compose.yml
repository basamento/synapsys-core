name: synapsys-core

services:
  core:
    image: ghcr.io/basamento/synapsys-core:${SYNAPSYS_CORE_IMAGE_TAG:-latest}
    container_name: synapsys-core
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy
    env_file:
      - .env
    volumes:
      - synapsys_data:/app/data

networks:
  proxy:
    external: true
    name: proxy

volumes:
  synapsys_data:
    external: true
    name: synapsys_data
