<!-- @dsCard group="Spacing" viewport="700x140" subtitle="4 to 32px; the source UI mixes odd values and the system keeps them" name="Spacing scale" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Spacing scale</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="row" style="align-items: flex-end; gap: 14px;">
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 4px; height: 4px; background: var(--brand); border-radius: 2px;"></div><div class="val">4px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 6px; height: 6px; background: var(--brand); border-radius: 2px;"></div><div class="val">6px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 8px; height: 8px; background: var(--brand); border-radius: 2px;"></div><div class="val">8px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 10px; height: 10px; background: var(--brand); border-radius: 2px;"></div><div class="val">10px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 12px; height: 12px; background: var(--brand); border-radius: 2px;"></div><div class="val">12px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 14px; height: 14px; background: var(--brand); border-radius: 2px;"></div><div class="val">14px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 16px; height: 16px; background: var(--brand); border-radius: 2px;"></div><div class="val">16px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 18px; height: 18px; background: var(--brand); border-radius: 2px;"></div><div class="val">18px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 20px; height: 20px; background: var(--brand); border-radius: 2px;"></div><div class="val">20px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 22px; height: 22px; background: var(--brand); border-radius: 2px;"></div><div class="val">22px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 26px; height: 26px; background: var(--brand); border-radius: 2px;"></div><div class="val">26px</div></div>
  <div class="sw" style="align-items: center; gap: 6px;"><div style="width: 32px; height: 32px; background: var(--brand); border-radius: 2px;"></div><div class="val">32px</div></div>
</div>
</body>
</html>
