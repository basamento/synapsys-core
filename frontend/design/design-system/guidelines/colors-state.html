<!-- @dsCard group="Colors" viewport="700x150" subtitle="Teal running, violet idle, amber stopping, red failed — never reassigned" name="State colours" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>State colours</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="row" style="gap: 12px;">
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--teal-500);"></div><div class="lbl">running</div><div class="val">var(--teal-500)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-600);"></div><div class="lbl">idle</div><div class="val">var(--violet-600)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--amber-500);"></div><div class="lbl">stopping</div><div class="val">var(--amber-500)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--red-600);"></div><div class="lbl">failed</div><div class="val">var(--red-600)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--red-500);"></div><div class="lbl">failed dark</div><div class="val">var(--red-500)</div></div>
</div>
</body>
</html>
