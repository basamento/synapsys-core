<!-- @dsCard group="Brand" viewport="700x140" subtitle="5 · 8 · 10 · 12 · 16 · pill — cards at 12, tables at 12, sheets at 16" name="Radii" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Radii</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="row" style="gap: 14px;">
  <div class="sw" style="width: 84px;"><div style="height: 56px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-xs);"></div><div class="lbl">xs</div></div>
  <div class="sw" style="width: 84px;"><div style="height: 56px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-sm);"></div><div class="lbl">sm</div></div>
  <div class="sw" style="width: 84px;"><div style="height: 56px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md);"></div><div class="lbl">md</div></div>
  <div class="sw" style="width: 84px;"><div style="height: 56px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg);"></div><div class="lbl">lg</div></div>
  <div class="sw" style="width: 84px;"><div style="height: 56px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-xl);"></div><div class="lbl">xl</div></div>
  <div class="sw" style="width: 84px;"><div style="height: 56px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-pill);"></div><div class="lbl">pill</div></div>
</div>
</body>
</html>
