<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Brand violet</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="row" style="gap: 12px;">
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-100);"></div><div class="lbl">violet 100</div><div class="val">var(--violet-100)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-300);"></div><div class="lbl">violet 300</div><div class="val">var(--violet-300)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-500);"></div><div class="lbl">violet 500</div><div class="val">var(--violet-500)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-600);"></div><div class="lbl">violet 600</div><div class="val">var(--violet-600)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-700);"></div><div class="lbl">violet 700</div><div class="val">var(--violet-700)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--violet-950);"></div><div class="lbl">violet 950</div><div class="val">var(--violet-950)</div></div>
</div>
</body>
</html>
