<!-- @dsCard group="Colors" viewport="700x150" subtitle="Blue-black ramp behind the dark theme" name="Dark neutrals" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Dark neutrals</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="row" style="gap: 12px;">
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-900);"></div><div class="lbl">ink 900</div><div class="val">var(--ink-900)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-850);"></div><div class="lbl">ink 850</div><div class="val">var(--ink-850)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-750);"></div><div class="lbl">ink 750</div><div class="val">var(--ink-750)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-700);"></div><div class="lbl">ink 700</div><div class="val">var(--ink-700)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-600);"></div><div class="lbl">ink 600</div><div class="val">var(--ink-600)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-300);"></div><div class="lbl">ink 300</div><div class="val">var(--ink-300)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-100);"></div><div class="lbl">ink 100</div><div class="val">var(--ink-100)</div></div>
  <div class="sw" style="width: 96px;"><div class="chip" style="background: var(--ink-50);"></div><div class="lbl">ink 50</div><div class="val">var(--ink-50)</div></div>
</div>
</body>
</html>
