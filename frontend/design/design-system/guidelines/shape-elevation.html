<!-- @dsCard group="Brand" viewport="700x160" subtitle="One soft card shadow, a raised step, an overlay step, and the brand glow" name="Elevation" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Elevation</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="row" style="gap: 16px;">
  <div class="sw" style="flex: 1;"><div style="height: 62px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);"></div><div class="lbl">card</div></div>
  <div class="sw" style="flex: 1;"><div style="height: 62px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised);"></div><div class="lbl">raised</div></div>
  <div class="sw" style="flex: 1;"><div style="height: 62px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-overlay);"></div><div class="lbl">overlay</div></div>
  <div class="sw" style="flex: 1;"><div style="height: 62px; background: var(--brand); border-radius: var(--radius-md); box-shadow: var(--shadow-brand);"></div><div class="lbl">brand</div></div>
</div>
</body>
</html>
