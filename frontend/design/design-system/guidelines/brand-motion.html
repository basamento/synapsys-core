<!-- @dsCard group="Brand" viewport="700x130" subtitle="120ms hover, 180ms layout, one ease — nothing bounces" name="Motion" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Motion</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="col" style="gap: 8px; font: var(--text-body-md); color: var(--text-body);">
  <div class="row" style="justify-content: space-between;"><span>Hover, press, tint</span><span class="val">120ms cubic-bezier(.2,0,.2,1)</span></div>
  <div class="row" style="justify-content: space-between;"><span>Width, height, position</span><span class="val">180ms same ease</span></div>
  <div class="row" style="justify-content: space-between;"><span>Live signals only</span><span class="val">pulse 1.4s · spin 720ms · shimmer 1.4s</span></div>
  <div class="row" style="justify-content: space-between;"><span>Never</span><span class="val">bounce, spring, scale-in modals, parallax</span></div>
</div>
</body>
</html>
