<!-- @dsCard group="Colors" viewport="700x130" subtitle="canvas · card · subtle · sunken, the four planes of the light theme" name="Surfaces — light" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <title>Surfaces — light</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .sw { display: flex; flex-direction: column; gap: 6px; }
    .chip { height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .val { font: var(--text-mono-sm); color: var(--text-muted); }
    .pane { padding: 16px; border-radius: var(--radius-lg); background: var(--canvas); border: 1px solid var(--border); }
    
  </style></head>
<body>
<div class="pane" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
  <div class="sw"><div class="chip" style="background: var(--canvas);"></div><div class="lbl">canvas</div></div>
  <div class="sw"><div class="chip" style="background: var(--surface-card);"></div><div class="lbl">card</div></div>
  <div class="sw"><div class="chip" style="background: var(--surface-subtle);"></div><div class="lbl">subtle</div></div>
  <div class="sw"><div class="chip" style="background: var(--surface-sunken);"></div><div class="lbl">sunken</div></div>
</div>
</body>
</html>
