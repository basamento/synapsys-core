<!-- @dsCard group="Brand" viewport="700x180" subtitle="Nucleus: one soma, three axons, three terminals" name="Lockup" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lockup</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 18px 20px; font: var(--text-body-md); }
    .row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .wm { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.025em; color: var(--text-heading); }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
    .note { font: var(--text-body-sm); color: var(--text-muted); }
  </style>
</head>
<body>
<div style="display: flex; flex-direction: column; gap: 16px;">
  <div class="row">
    <span style="display: inline-flex; align-items: center; gap: 11px;">
      <img src="../assets/synapsys-mark.svg" width="34" height="34" alt="Synapsys">
      <span class="wm" style="font-size: 25px;">Synapsys</span>
      <span class="lbl">Cortex</span>
    </span>
    <span style="display: inline-flex; padding: 8px; border: 1px dashed var(--border-brand); border-radius: var(--radius-sm);">
      <img src="../assets/synapsys-mark.svg" width="32" height="32" alt="">
    </span>
    <img src="../assets/synapsys-mark-plain.svg" width="30" height="30" alt="">
    <img src="../assets/synapsys-mark-mono.svg" width="30" height="30" alt="" style="color: var(--text-heading);">
    <img src="../assets/synapsys-favicon.svg" width="18" height="18" alt="">
  </div>
  <div class="note">Wordmark is Bricolage Grotesque 800 at &minus;0.025em; product suffix in mono caps. Clear space is 25% of the mark's width. Below 20px use the favicon file &mdash; the 2.6 axon stroke drops under one device pixel and greys out.</div>
</div>
</body>
</html>
