<!-- @dsCard group="Components" viewport="700x330" subtitle="Dropdown, tooltip and the stop-confirmation dialog" name="Overlays" -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Overlays</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { padding: 18px 20px; }
    .grp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .lbl { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-faint); }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="../../card-boot.js"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { DropdownMenu, Tooltip, Dialog, Button, Badge } = window.dsResolve(["DropdownMenu", "Tooltip", "Dialog", "Button", "Badge"]);
    function Demo() {
      return (
        <div className="stack" style={{ position: "relative", height: 290 }}>
          <div className="grp" style={{ gap: 18 }}>
            <DropdownMenu open trigger={<Button size="sm" variant="outline">10 / page</Button>}
              items={[{value:10,label:"10 / page",active:true},{value:25,label:"25 / page"},{value:50,label:"50 / page"}]} />
            <Tooltip label="Last sync: 18:11:10"><Badge tone="running" dot>Core online</Badge></Tooltip>
          </div>
          <div style={{ position: "absolute", inset: "70px 0 0", borderRadius: "var(--radius-lg)", overflow: "hidden" }}>
            <Dialog title="Stop endless process 10?" description="The worker acknowledges within one heartbeat." width={380}
              footer={<><Button variant="outline">Cancel</Button><Button variant="destructive">Stop process</Button></>} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
