openapi: 3.1.0
info:
  title: Synapsys Core API
  version: 1.0.0
  description: |
    The v1 control-plane contract. Workers open every connection; Core never
    calls a worker. `heartbeatInterval` is always expressed in whole seconds.

    Two independent credentials exist. Workers authenticate with a bearer token
    on the heartbeat endpoint. Operators and the bundled console authenticate
    with a session cookie obtained from `POST /api/auth/login`, plus a CSRF
    header on unsafe methods. `GET /api/health` is public.

    Setting `SYNAPSYS_AUTH_DISABLED=true` disables both, and every endpoint then
    responds as if authenticated. That is intended for local development only.
servers:
  - url: http://localhost:8080
    description: Local Core
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check Core availability
      responses:
        '200':
          description: Core is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/workers/heartbeat:
    post:
      operationId: heartbeatWorker
      summary: Report worker state and receive process commands
      description: |
        Sends a complete snapshot of the worker's readable processes. A malformed
        process is skipped without rejecting valid siblings. The request is rejected
        only when it contains processes but none are readable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Worker state was recorded and current commands are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/processes/{id}/desired-state:
    put:
      security:
        - sessionCookie: []
      operationId: commandProcess
      summary: Start or stop a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessCommandRequest'
      responses:
        '204':
          description: Command was recorded for delivery on the next heartbeat.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Process not found.
  /api/state:
    get:
      security:
        - sessionCookie: []
      operationId: getState
      summary: Read the paginated console state
      parameters:
        - $ref: '#/components/parameters/workersPage'
        - $ref: '#/components/parameters/workersPageSize'
        - $ref: '#/components/parameters/processesPage'
        - $ref: '#/components/parameters/processesPageSize'
        - $ref: '#/components/parameters/executionsPage'
        - $ref: '#/components/parameters/executionsPageSize'
        - $ref: '#/components/parameters/actionsPage'
        - $ref: '#/components/parameters/actionsPageSize'
      responses:
        '200':
          description: Current state and execution/action history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/login:
    post:
      operationId: login
      summary: Open an operator session
      description: |
        Sets the `synapsys_session` and `synapsys_csrf` cookies on success. Send
        the `synapsys_csrf` value as an `X-CSRF-Token` header on later unsafe
        requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/session:
    get:
      operationId: getSession
      summary: Check whether the current session is valid
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Close the operator session
      description: Expires both cookies. Succeeds whether or not a session existed.
      responses:
        '204':
          description: Session closed.
  /api/auth/worker-tokens:
    get:
      security:
        - sessionCookie: []
      operationId: listWorkerTokens
      summary: List worker tokens
      description: Returns metadata only. Token secrets are never readable after creation.
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      security:
        - sessionCookie: []
      operationId: createWorkerToken
      summary: Create a worker token
      description: |
        The generated secret is returned **once**, in this response, and is stored
        only as a hash. It cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTokenCreateRequest'
      responses:
        '201':
          description: Token created. Record the secret now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerTokenSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/worker-tokens/{id}:
    delete:
      security:
        - sessionCookie: []
      operationId: revokeWorkerToken
      summary: Revoke a worker token
      description: |
        Revocation is immediate and permanent. Workers still presenting the token
        begin receiving 401 on their next heartbeat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: Token revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Token not found, or already revoked.
  /api/processes:
    get:
      security:
        - sessionCookie: []
      operationId: listProcesses
      summary: List every known process
      description: |
        A flat, unpaginated view of every process across every worker. Prefer
        `/api/state`, which is paginated and carries execution history.
      responses:
        '200':
          description: Every known process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/executions/{id}/logs:
    get:
      security:
        - sessionCookie: []
      operationId: listExecutionLogs
      summary: Read the console output of one execution
      description: |
        Lines are ordered by `sequence`. Poll incrementally by passing the highest
        sequence already seen as `after`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: after
          in: query
          description: Return only lines with a sequence greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Console output for the execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Worker credential, sent as `Authorization: Bearer <token>`. Accepts either
        a token created through the console, or the `SYNAPSYS_WORKER_TOKEN`
        deployment credential.
    sessionCookie:
      type: apiKey
      in: cookie
      name: synapsys_session
      description: |
        Operator session issued by `POST /api/auth/login`. Unsafe methods must
        also send the `synapsys_csrf` cookie value in an `X-CSRF-Token` header.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Credential missing, malformed, revoked, or expired.
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Core could not complete the request.
      content:
        text/plain:
          schema:
            type: string
  parameters:
    workersPage:
      name: workersPage
      in: query
      schema: {$ref: '#/components/schemas/PageNumber'}
    workersPageSize:
      name: workersPageSize
      in: query
      schema: {$ref: '#/components/schemas/PageSize'}
    processesPage:
      name: processesPage
      in: query
      schema: {$ref: '#/components/schemas/PageNumber'}
    processesPageSize:
      name: processesPageSize
      in: query
      schema: {$ref: '#/components/schemas/PageSize'}
    executionsPage:
      name: executionsPage
      in: query
      schema: {$ref: '#/components/schemas/PageNumber'}
    executionsPageSize:
      name: executionsPageSize
      in: query
      schema: {$ref: '#/components/schemas/PageSize'}
    actionsPage:
      name: actionsPage
      in: query
      schema: {$ref: '#/components/schemas/PageNumber'}
    actionsPageSize:
      name: actionsPageSize
      in: query
      schema: {$ref: '#/components/schemas/PageSize'}
  schemas:
    PageNumber:
      type: integer
      minimum: 1
      default: 1
    PageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ProcessType:
      type: string
      enum: [endless, progressive]
    ExecutionState:
      type: string
      enum: [idle, running, stopping, failed]
    DesiredState:
      type: string
      enum: [idle, running, stopping]
      description: In heartbeat responses, idle means that no command is outstanding.
    HeartbeatProcess:
      type: object
      required: [name, type, currentState, ackToken]
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/ProcessType'
        currentState:
          $ref: '#/components/schemas/ExecutionState'
        ackToken:
          type: integer
          format: int64
          minimum: 0
        runId:
          type: [integer, 'null']
          format: int64
          description: The Core-assigned active run identifier, echoed unchanged.
    HeartbeatRequest:
      type: object
      required: [workerName, framework, heartbeatInterval, processes]
      properties:
        workerName:
          type: string
          minLength: 1
        framework:
          type: string
          minLength: 1
        host:
          type: string
          description: Defaults to the connection's remote address when omitted.
        heartbeatInterval:
          type: integer
          minimum: 1
          description: Positive whole number of seconds between heartbeats.
        processes:
          type: array
          items:
            $ref: '#/components/schemas/HeartbeatProcess'
        logs:
          type: array
          description: |
            Console output produced by this worker's processes since the previous
            heartbeat. Optional: a client that does not capture output omits it.
            Entries whose runId is null are discarded, since they cannot be
            attached to an execution.
          items:
            $ref: '#/components/schemas/ProcessLog'
    ProcessLog:
      type: object
      required: [processName, timestamp, message]
      properties:
        processName:
          type: string
          minLength: 1
          description: Must match a process reported by this worker.
        runId:
          type: [integer, 'null']
          format: int64
          description: Execution the line belongs to, as sent by Core in a command.
        sequence:
          type: [integer, 'null']
          format: int64
          description: |
            Monotonic counter within one run, used to order lines that share a
            timestamp. Clients should send it.
        timestamp:
          type: string
          format: date-time
          description: When the line was produced, on the worker's clock.
        source:
          type: string
          enum: [stdout, stderr]
        level:
          type: string
          enum: [info, error]
        message:
          type: string
          description: One line, without a trailing newline.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        username:
          type: string
          description: Omitted when authentication is disabled.
    WorkerToken:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Absent until the token authenticates a heartbeat.
        revokedAt:
          type: string
          format: date-time
          description: Absent while the token is active.
    WorkerTokenCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          default: Worker token
          description: Blank or omitted becomes "Worker token".
    WorkerTokenSecret:
      allOf:
        - $ref: '#/components/schemas/WorkerToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                The secret, formatted `syn_<id>_<secret>`. Returned only here;
                Core stores a hash and cannot reproduce it.
    ProcessListResponse:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessListItem'
    ProcessListItem:
      type: object
      description: One process, flattened together with the worker that owns it.
      required: [id, name, workerId, workerName, type, currentState, desiredState, desiredToken, ackToken, status, lastTouch, heartbeatInterval]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        workerId:
          type: integer
          format: int64
        workerName:
          type: string
        framework:
          type: string
        host:
          type: string
        type:
          $ref: '#/components/schemas/ProcessType'
        currentState:
          $ref: '#/components/schemas/ExecutionState'
        desiredState:
          $ref: '#/components/schemas/DesiredState'
        desiredToken:
          type: integer
          format: int64
        ackToken:
          type: integer
          format: int64
        runId:
          type: [integer, 'null']
          format: int64
        status:
          type: string
          description: Whether the owning worker is currently considered connected.
        lastTouch:
          type: string
          format: date-time
        heartbeatInterval:
          type: integer
          description: The worker's reported heartbeat interval, in seconds.
    ExecutionLogsResponse:
      type: object
      required: [executionId, logs]
      properties:
        executionId:
          type: integer
          format: int64
        logs:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionLog'
    ExecutionLog:
      type: object
      required: [id, executionId, sequence, timestamp, source, level, message]
      properties:
        id:
          type: integer
          format: int64
        executionId:
          type: integer
          format: int64
        sequence:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        source:
          type: string
          enum: [stdout, stderr]
        level:
          type: string
          enum: [info, error]
        message:
          type: string
    ProcessCommand:
      allOf:
        - $ref: '#/components/schemas/HeartbeatProcess'
        - type: object
          required: [desiredState, desiredToken]
          properties:
            desiredState:
              $ref: '#/components/schemas/DesiredState'
            desiredToken:
              type: integer
              format: int64
              minimum: 0
    HeartbeatResponse:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessCommand'
    ProcessCommandRequest:
      type: object
      required: [desiredState]
      properties:
        desiredState:
          type: string
          enum: [running, stopping]
    Worker:
      type: object
      additionalProperties: true
      required: [id, name, framework, host, firstConnection, lastConnection, lastTouch]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        framework: {type: string}
        host: {type: string}
        firstConnection: {type: string, format: date-time}
        lastConnection: {type: string, format: date-time}
        lastTouch: {type: string, format: date-time}
    Process:
      type: object
      additionalProperties: true
      required: [id, name, workerId, type, createdAt, heartbeatInterval, desiredToken, ackToken]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        workerId: {type: integer, format: int64}
        type: {$ref: '#/components/schemas/ProcessType'}
        createdAt: {type: string, format: date-time}
        heartbeatInterval:
          type: integer
          description: Heartbeat interval in seconds.
        desiredToken: {type: integer, format: int64}
        ackToken: {type: integer, format: int64}
        runId: {type: [integer, 'null'], format: int64}
    Execution:
      type: object
      required: [id, processId, createdAt, modifiedAt, currentStatus, desiredState, status]
      properties:
        id: {type: integer, format: int64}
        processId: {type: integer, format: int64}
        runId: {type: [integer, 'null'], format: int64}
        createdAt: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
        currentStatus: {$ref: '#/components/schemas/ExecutionState'}
        desiredState: {$ref: '#/components/schemas/DesiredState'}
        status: {type: string, enum: [active, inactive]}
    Action:
      type: object
      additionalProperties: true
    ProcessOverview:
      type: object
      additionalProperties: true
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        totalItems: {type: integer}
        totalPages: {type: integer}
    StateResponse:
      type: object
      required: [workers, processes, executions, actions, processOverviews, pagination]
      properties:
        workers:
          type: array
          items: {$ref: '#/components/schemas/Worker'}
        processes:
          type: array
          items: {$ref: '#/components/schemas/Process'}
        executions:
          type: array
          items: {$ref: '#/components/schemas/Execution'}
        actions:
          type: array
          items: {$ref: '#/components/schemas/Action'}
        processOverviews:
          type: array
          items: {$ref: '#/components/schemas/ProcessOverview'}
        pagination:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PageInfo'
